<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f1720">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="轮腿作战">
<title>轮腿 34 周作战日历</title>
<style>
  :root{
    --bg:#0f1720; --card:#18222e; --card2:#1e2a38; --line:#2b3a4a;
    --fg:#e8eef5; --dim:#8fa2b5; --accent:#4ea1ff; --ok:#3fb950; --doing:#d29922; --todo:#39485a;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f4f6f9; --card:#ffffff; --card2:#f0f3f7; --line:#dde4ec;
           --fg:#16212c; --dim:#5c6b7a; --accent:#0a66c2; --ok:#1a7f37; --doing:#9a6700; --todo:#cdd6e0; }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
    font-size:16px;line-height:1.6;padding-bottom:60px}
  header{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line);
    padding:10px 14px calc(8px + env(safe-area-inset-bottom,0px));padding-top:calc(10px + env(safe-area-inset-top,0px))}
  h1{margin:0 0 6px;font-size:17px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline}
  h1 small{font-weight:400;color:var(--dim);font-size:12px}
  .back{color:var(--dim);text-decoration:none;font-weight:400;font-size:13px;margin-right:6px;white-space:nowrap}
  .bar{height:8px;border-radius:5px;background:var(--todo);overflow:hidden}
  .bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--ok));transition:width .3s}
  .barline{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-top:4px}
  main{padding:12px 12px 0}
  .phase{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
  .phase>summary{padding:13px 14px;cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px}
  .phase>summary::-webkit-details-marker{display:none}
  .pname{font-weight:700;font-size:15px;flex:1}
  .pmeta{font-size:11px;color:var(--dim);text-align:right;line-height:1.35}
  .week{padding:12px 14px;border-top:1px solid var(--line)}
  .week.now{background:linear-gradient(90deg,rgba(78,161,255,.12),transparent)}
  .whead{display:flex;align-items:center;gap:9px}
  .wid{font-weight:700;font-size:14px;min-width:44px}
  .wdates{font-size:12px;color:var(--dim);flex:1}
  .now-tag{font-size:10px;background:var(--accent);color:#fff;border-radius:6px;padding:2px 7px;font-weight:700}
  .chip{width:40px;height:40px;border-radius:11px;border:1px solid var(--line);background:var(--card2);
    display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;user-select:none;flex:0 0 auto}
  .chip.s1{border-color:var(--doing)} .chip.s2{border-color:var(--ok)}
  .tasks{margin:8px 0 0;padding:0;list-style:none}
  .tasks li{display:flex;gap:9px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed var(--line);cursor:pointer}
  .tasks li:last-child{border-bottom:none}
  .box{width:20px;height:20px;border-radius:5px;border:1.5px solid var(--dim);flex:0 0 auto;margin-top:2px;
    display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff}
  .tasks li.on .box{background:var(--ok);border-color:var(--ok)}
  .tasks li.on .tx{color:var(--dim);text-decoration:line-through}
  .crit{font-size:12px;color:var(--dim);margin-top:8px;padding-left:2px}
  .crit b{color:var(--accent)}
  footer{padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px));font-size:13px;color:var(--dim);text-align:center}
  footer button{margin-top:10px;background:var(--card);color:var(--dim);border:1px solid var(--line);
    border-radius:9px;padding:10px 16px;font-size:13px}
  .legend{font-size:12px;color:var(--dim);margin:0 0 10px;padding:0 2px}
</style>
</head>
<body>

<header>
  <h1><a href="index.html" class="back">‹ 博客</a>轮腿 34 周作战日历 <small id="today"></small></h1>
  <div class="bar"><i id="allbar"></i></div>
  <div class="barline"><span id="alltext">0 / 34 周</span><span>2026-10-07 → 2027-05-30</span></div>
</header>

<main>
  <p class="legend">点方块切换状态：⬜ 未开始 → 🟨 进行中 → 🟩 已完成 · 点任务行打勾（记录保存在本机浏览器）</p>
  <div id="app"></div>
</main>

<footer>
  单人电控 · 每周 10–20 h（寒假可到 30 h）<br>
  卡住超过 3 天就降级：锁膝当直腿车 → 位置环模拟力控 → 只保能站能慢走
  <div><button id="reset">清空本机打卡记录</button></div>
</footer>

<script>
/* ============ 计划数据 ============ */
var PHASES = [
  {n:"M0 · 地基",        s:"10/07–10/25", g:"数学直觉 + 工具链 + 台架就位", ids:[1,2,3]},
  {n:"M1 · 单腿台架",    s:"10/26–11/29", g:"腿长环 / 支持力 / 测试报告",   ids:[4,5,6,7,8]},
  {n:"M2 · 吊架直立",    s:"11/30–01/10", g:"站立 30 s / 抗推 2 s / 变腿长", ids:[9,10,11,12,13,14]},
  {n:"M3 · 平地运动",    s:"01/11–03/07", g:"走 5 min / 转 360° / roll 3°",  ids:[15,16,17,18,19,20,21,22]},
  {n:"M4 · 赛场化",      s:"03/08–05/02", g:"功率限制 / 云台联调 / 操作手",  ids:[23,24,25,26,27,28,29,30]},
  {n:"M5 · 赛前整备",    s:"05/03–05/30", g:"备件 / 走线 / 上场演练",        ids:[31,32,33,34]}
];

var WEEKS = [
 {id:1, p:0, t:["给机械发对接消息：单腿日期 / 接口 / 零位与限位 / 备件","看完 3Blue1Brown《线性代数的本质》","装 MuJoCo，编译通过第一个 C 例子"], c:"MuJoCo 窗口能动"},
 {id:2, p:0, t:["DR_CAN 控制理论：状态空间部分","MuJoCo 里加载 Upkie 的 URDF","传统步兵上打通 CAN 力矩模式 + 1 kHz 循环"], c:"能读到电机力矩反馈"},
 {id:3, p:0, t:["DR_CAN 的 LQR 部分，自己推一遍轮式倒立摆的 A、B","用 mjd_transitionFD 拿线性化矩阵","装 Octave，算出第一个 K","单腿台架 + 吊架 + 护具 + 急停到位"], c:"Octave 输出可用增益"},
 {id:4, p:1, t:["读编码器 / 电机 ID / 零位标定","关节软限位 + 力矩限幅 + 急停"], c:"能转到指定角度且越限截断"},
 {id:5, p:1, t:["用 C 写 2R 正解 / 逆解 / 雅可比","主机单测 IK(FK(q)) == q","扫工作空间，标出奇异点"], c:"单测通过"},
 {id:6, p:1, t:["力控标定扭矩常数，测电流环带宽","搭 Ozone + J-Link RTT 波形系统"], c:"力矩阶跃有可复现曲线"},
 {id:7, p:1, t:["腿长环 PID + 重力前馈","支持力估计（由关节力矩反推）"], c:"腿长阶跃无静差、无持续振荡"},
 {id:8, p:1, t:["台架支持力验证（误差 < 10%）","写台架测试报告","备件到位"], c:"报告可复现 → M1 达成"},
 {id:9,  p:2, t:["整车电控装配：板子 / 电容 / 电池 / IMU、CAN 布线、ID 分配","实测通信预算：1 kHz 是否丢帧"], c:"1 kHz 无丢帧（必要时分两条 CAN）"},
 {id:10, p:2, t:["姿态估计：IMU 零偏标定 + 滤波","速度估计：轮速 + 加速度计融合"], c:"静止漂移可接受，手推方向正确"},
 {id:11, p:2, t:["吊架平衡：先锁死膝关节当直腿车，只调平衡环"], c:"吊架上静止 30 s 不翻"},
 {id:12, p:2, t:["吊架抗扰：推、拉、小幅冲击"], c:"受推 2 s 内恢复"},
 {id:13, p:2, t:["打开腿长环","上线增益调度 K(l)"], c:"腿长从最短扫到最长仍稳定"},
 {id:14, p:2, t:["速度环 / 位置环","阶段复盘 + 备件补货"], c:"速度阶跃 0.5 m/s 稳定 → M2 达成"},
 {id:15, p:3, t:["下吊架（先半吊），平地 0.3 m/s 慢速"], c:"连续走 5 分钟不摔"},
 {id:16, p:3, t:["提速到 1 m/s","练加减速与制动"], c:"刹车不点头翻车"},
 {id:17, p:3, t:["转向：yaw 环 PID + 轮差速"], c:"原地转 360° 不摔"},
 {id:18, p:3, t:["防劈叉：两腿虚拟关节角差 PID","春节机械停摆：代码重构 + 写文档"], c:"直线行走两腿不前后错开"},
 {id:19, p:3, t:["横滚控制：左右腿长差动"], c:"roll 误差 3° 以内"},
 {id:20, p:3, t:["VMC 力映射全通（虚拟腿力 → 髋膝力矩）"], c:"指定腿输出 100 N 支持力，误差可接受"},
 {id:21, p:3, t:["抗扰与鲁棒：过障、斜坡、软地面"], c:"跑完整套操作流程不摔"},
 {id:22, p:3, t:["参数整定与复盘","整理已知问题清单"], c:"M3 达成"},
 {id:23, p:4, t:["功率限制（参考港科大 ENTERPRIZE 开源）"], c:"卡墙不超功率"},
 {id:24, p:4, t:["云台 / 图传 / 自瞄 / 裁判系统联调"], c:"整机联调通过"},
 {id:25, p:4, t:["离地检测 + 落地缓冲"], c:"抱起放下不失控"},
 {id:26, p:4, t:["可靠性：线缆、温升、连接器、螺丝胶"], c:"连续运行 30 min 无异常"},
 {id:27, p:4, t:["操作手练习计划（每周固定时长）"], c:"操作手能独立完成一套动作"},
 {id:28, p:4, t:["极限测试：撞、摔、下台阶，记录失效点"], c:"失效点有对策且已修"},
 {id:29, p:4, t:["战术演练 + 备件清点"], c:"备件箱清单齐"},
 {id:30, p:4, t:["全流程模拟上场"], c:"M4 达成"},
 {id:31, p:5, t:["保养 + 走线整理 + 关键件备份"], c:""},
 {id:32, p:5, t:["上场演练（含故障恢复：断电重启、零位重标定）"], c:""},
 {id:33, p:5, t:["赛前冻结代码","建立返场检查表"], c:""},
 {id:34, p:5, t:["区域赛 🚩"], c:""}
];

/* ============ 存储（记录只存在本机浏览器） ============ */
var KEY_W = 'legplan.week', KEY_T = 'legplan.task';
var wk = JSON.parse(localStorage.getItem(KEY_W) || '{}');
var tk = JSON.parse(localStorage.getItem(KEY_T) || '{}');
function save(){ localStorage.setItem(KEY_W, JSON.stringify(wk)); localStorage.setItem(KEY_T, JSON.stringify(tk)); }

/* ============ 日期计算 ============ */
var W1 = new Date(2026, 9, 5);            // 2026-10-05 周一
function startOf(id){ var d = new Date(W1); d.setDate(d.getDate() + 7 * (id - 1)); return d; }
function fmt(d){ return (d.getMonth() + 1) + '/' + ('0' + d.getDate()).slice(-2); }
function range(id){ var a = startOf(id), b = new Date(a); b.setDate(b.getDate() + 6); return fmt(a) + '–' + fmt(b); }
function currentId(){
  var t = new Date(); t.setHours(0,0,0,0);
  var mon = new Date(t); mon.setDate(mon.getDate() - ((mon.getDay() + 6) % 7));   // 本周一
  var diff = Math.round((mon - W1) / 604800000);
  return Math.min(34, Math.max(1, diff + 1));
}

/* ============ 渲染 ============ */
var CUR = currentId(), openPhase = WEEKS[CUR - 1].p, html = '';
PHASES.forEach(function(ph, pi){
  var done = ph.ids.filter(function(i){ return wk[i] === 2; }).length;
  html += '<details class="phase"' + (pi === openPhase ? ' open' : '') + '>' +
    '<summary><span class="pname">' + ph.n + '</span>' +
    '<span class="pmeta">' + ph.s + '<br>' + done + '/' + ph.ids.length + ' 周<br>' + ph.g + '</span></summary>';
  ph.ids.forEach(function(i){
    var w = WEEKS[i - 1], st = wk[i] || 0, isNow = (i === CUR);
    html += '<div class="week' + (isNow ? ' now' : '') + '" id="w' + i + '">' +
      '<div class="whead">' +
        '<span class="wid">W' + ('0' + i).slice(-2) + '</span>' +
        '<span class="wdates">' + range(i) + (isNow ? ' <span class="now-tag">本周</span>' : '') + '</span>' +
        '<span class="chip s' + st + '" data-w="' + i + '">' + (st === 2 ? '🟩' : st === 1 ? '🟨' : '⬜') + '</span>' +
      '</div><ul class="tasks">';
    w.t.forEach(function(txt, ti){
      var on = tk[i + ':' + ti] ? ' on' : '';
      html += '<li class="' + on.trim() + '" data-w="' + i + '" data-t="' + ti + '">' +
              '<span class="box">' + (on ? '✓' : '') + '</span><span class="tx">' + txt + '</span></li>';
    });
    html += '</ul>' + (w.c ? '<div class="crit">打卡判据：<b>' + w.c + '</b></div>' : '') + '</div>';
  });
  html += '</details>';
});
document.getElementById('app').innerHTML = html;

var now = new Date();
document.getElementById('today').textContent = now.getFullYear() + '-' +
  ('0' + (now.getMonth() + 1)).slice(-2) + '-' + ('0' + now.getDate()).slice(-2);

/* ============ 总进度 ============ */
function refreshAll(){
  var done = 0, doing = 0;
  for (var i = 1; i <= 34; i++){ if (wk[i] === 2) done++; else if (wk[i] === 1) doing++; }
  document.getElementById('allbar').style.width = (done / 34 * 100).toFixed(1) + '%';
  document.getElementById('alltext').textContent =
    done + ' / 34 周已完成 · ' + doing + ' 周进行中 · ' + (34 - done - doing) + ' 周未开始';
  PHASES.forEach(function(ph, pi){
    var d = ph.ids.filter(function(i){ return wk[i] === 2; }).length;
    var el = document.querySelectorAll('.phase .pmeta')[pi];
    if (el) el.innerHTML = ph.s + '<br>' + d + '/' + ph.ids.length + ' 周<br>' + ph.g;
  });
}

/* ============ 交互 ============ */
document.getElementById('app').addEventListener('click', function(e){
  var chip = e.target.closest('.chip');
  if (chip){
    var i = +chip.dataset.w, s = ((wk[i] || 0) + 1) % 3;
    wk[i] = s; save();
    chip.className = 'chip s' + s;
    chip.textContent = s === 2 ? '🟩' : s === 1 ? '🟨' : '⬜';
    refreshAll();
    return;
  }
  var li = e.target.closest('.tasks li');
  if (li){
    var k = li.dataset.w + ':' + li.dataset.t;
    tk[k] = !tk[k]; save();
    li.classList.toggle('on', !!tk[k]);
    li.querySelector('.box').textContent = tk[k] ? '✓' : '';
  }
});

document.getElementById('reset').addEventListener('click', function(){
  if (confirm('清空本机所有打卡记录？')){
    wk = {}; tk = {}; save(); location.reload();
  }
});

refreshAll();

/* 首次打开自动滚到本周 */
if (!sessionStorage.getItem('legplan.scrolled')){
  sessionStorage.setItem('legplan.scrolled', '1');
  var el = document.getElementById('w' + CUR);
  if (el) setTimeout(function(){ el.scrollIntoView({block:'center'}); }, 200);
}
</script>
</body>
</html>
